# FR-139: Node 20 CI gate - npm test + npm run synth (vision S4 / release D1)
# FR-2021: concurrency cancel-in-progress + path-aware synth skip for docs/harvest tips
# FR-2611: docs/skills-only PRs skip heavy suite; required check test-and-synth still greens on ubuntu
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per PR/ref. PR pushes cancel stale queued/running siblings.
# Pushes to main never cancel an in-progress main run (docs merges were killing
# every full main run); a newer main push only replaces a still-pending one.
concurrency:
  group: a-search-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap path classify on GitHub-hosted runners (never queues on whiterabbit).
  classify:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.detect.outputs.heavy }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect heavy vs docs/skills-only
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            node scripts/ci-needs-heavy.js --event push --ref refs/heads/main
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -z "${BASE}" ] || [ -z "${HEAD}" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing-pr-shas" >> "$GITHUB_OUTPUT"
            echo "heavy=true reason=missing-pr-shas"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE" "$HEAD" || true)"
          echo "changed_files<<"
          echo "$CHANGED"
          echo ">>"
          printf '%s\n' "$CHANGED" | node scripts/ci-needs-heavy.js --event pull_request --stdin

  # Job id must stay test-and-synth (ruleset required-ci-3948 context).
  test-and-synth:
    needs: classify
    # Docs/skills-only: ubuntu-latest (no whiterabbit slot). Code/main: self-hosted (forks stay ubuntu).
    runs-on: ${{ needs.classify.outputs.heavy != 'true' && 'ubuntu-latest' || (github.event.pull_request.head.repo.fork == true && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","a-search"]')) }}
    # Full suite includes in-process CDK synths + asset staging (FR-135 mssql).
    timeout-minutes: ${{ needs.classify.outputs.heavy == 'true' && 180 || 5 }}
    steps:
      - name: Docs/skills-only skip (FR-2611)
        if: needs.classify.outputs.heavy != 'true'
        run: |
          echo "FR-2611: skipping heavy npm test/synth (${{ needs.classify.outputs.reason }})"
          echo "Required check test-and-synth reports success without a whiterabbit job."

      - name: Checkout
        if: needs.classify.outputs.heavy == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        if: needs.classify.outputs.heavy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Python
        if: needs.classify.outputs.heavy == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        if: needs.classify.outputs.heavy == 'true'
        run: npm ci

      - name: Test
        if: needs.classify.outputs.heavy == 'true'
        run: npm test

      - name: Detect CDK-relevant paths
        if: needs.classify.outputs.heavy == 'true'
        id: need_synth
        shell: bash
        run: |
          set -euo pipefail
          # Always synth on main pushes (post-merge gate).
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "synth=true" >> "$GITHUB_OUTPUT"
            echo "reason=main-push"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          if [ -z "${BASE}" ] || [ -z "${HEAD}" ]; then
            echo "synth=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing-pr-shas"
            exit 0
          fi
          CHANGED="$(git diff --name-only "$BASE" "$HEAD" || true)"
          echo "changed_files<<"
          echo "$CHANGED"
          echo ">>"
          # Synth when CDK/runtime/stage/lockfile paths change. Docs, skills, and
          # most tests alone skip the long npm run synth (FR-2021 queue starvation).
          if printf '%s\n' "$CHANGED" | grep -E '^(cdk/|providers/|entry/|maintainer/|shared/|components-piece/|package(-lock)?\.json$|scripts/stage|scripts/smoke|cdk\.json$)' >/dev/null; then
            echo "synth=true" >> "$GITHUB_OUTPUT"
            echo "reason=cdk-relevant-paths"
          else
            echo "synth=false" >> "$GITHUB_OUTPUT"
            echo "reason=docs-harvest-or-tests-only"
          fi

      - name: Synth
        if: needs.classify.outputs.heavy == 'true' && steps.need_synth.outputs.synth == 'true'
        run: npm run synth

  # FR #4827: Node SEA Windows exes. Linux runners download the matching win-x64 node.exe.
  build-sea:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Version smoke (entries, before the exe inject)
        run: |
          node scripts/sea/annotator-entry.js --version
          node scripts/sea/sqlsearch-entry.js --version

      - name: Build SEA exes
        run: node scripts/build-a-search-sea.js --smoke

      - name: Upload a-annotator.exe and a-sqlsearch.exe
        uses: actions/upload-artifact@v4
        with:
          name: a-search-sea-windows
          path: |
            dist/sea/a-annotator.exe
            dist/sea/a-sqlsearch.exe
          if-no-files-found: error
