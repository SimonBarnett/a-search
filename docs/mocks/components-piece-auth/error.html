<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>a-search login - errors</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 28rem; color: #122; }
    .err { border: 1px solid #a33; padding: 1rem; border-radius: 6px; margin: 1rem 0; }
    .meta { color: #556; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Sign in errors</h1>
  <p class="meta">Wireframe AL3</p>
  <div class="err">
    <strong>Provider returned no contact</strong>
    <p>That login did not include email, phone, or contact. Choose another provider or use email OTP.</p>
  </div>
  <div class="err">
    <strong>OTP / magic link invalid</strong>
    <p>Code expired or link already used. Request a new one.</p>
  </div>
</body>
</html>
